<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#080d1a"/>
  <!-- Signal rings -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.3"/>
  <circle cx="50" cy="50" r="26" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.5"/>
  <circle cx="50" cy="50" r="14" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.8"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="5" fill="#60a5fa"/>
  <!-- Cross hairs -->
  <line x1="50" y1="8"  x2="50" y2="20" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="80" x2="50" y2="92" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8"  y1="50" x2="20" y2="50" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="92" y2="50" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
</svg>